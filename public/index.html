<link rel="icon" type="image/x-icon" href="%PUBLIC_URL%/favicon.ico" />

    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Web site created using create-react-app"
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>plusone photography</title>

       <!-- --- ADD THESE LINES FOR THE PREVIEW PHOTO --- -->
    
    <!-- 1. The Image (Must be an absolute URL, e.g., https://yourdomain.com/image.jpg) -->
    <meta property="og:image" content="https://res.cloudinary.com/dspjrym37/image/upload/v1780986720/OG2_hmudj5.jpg" />
    
    <!-- 2. Image Dimensions (Helps platforms render it correctly) -->
    <meta property="og:image:width" content="600" />
    <meta property="og:image:height" content="315" />
    
    <!-- 3. Title and Description for the Preview -->
    <meta property="og:title" content="plusone.photography" />
    <meta property="og:description" content="Award-winning urban and travel photographer exploring form, texture, and the interplay of light" />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://plusone.photography" />
    <meta property="og:site_name" content="Light | Shadow | Geometry" />


    <!-- Twitter Card Data (Optional but recommended) -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="plusone photography" />
    <meta name="twitter:description" content="Award-winning urban and travel photographer exploring form, texture, and the interplay of light" />
    <meta name="twitter:image" content="https://res.cloudinary.com/dspjrym37/image/upload/v1780986720/OG2_hmudj5.jpg" />

    <!-- --- END OF ADDED LINES --- -->
